name: vdf-smoke
on: workflow_dispatch

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, MaxClockSpeed | Format-List

      # Pas de vcpkg : la crate embarque mpir_gc_x64/mpir.lib.
      # Pas de surcharge de INCLUDE : bindgen doit voir les en-tetes MSVC.
      - name: Build
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release

      - name: Officiel (valide l'environnement)
        shell: pwsh
        run: .\target\release\vdf-smoke.exe official
        timeout-minutes: 3

      - name: Positif
        shell: pwsh
        run: .\target\release\vdf-smoke.exe positive
        timeout-minutes: 3

      - name: Negatif (ne doit pas boucler)
        shell: pwsh
        run: .\target\release\vdf-smoke.exe negative
        timeout-minutes: 3

      - name: Bench T
        shell: pwsh
        run: .\target\release\vdf-smoke.exe bench
        timeout-minutes: 10