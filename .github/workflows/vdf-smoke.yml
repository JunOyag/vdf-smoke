name: vdf-smoke
on: workflow_dispatch

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, MaxClockSpeed | Format-List

      # Pas de vcpkg : la crate embarque mpir_gc_x64/mpir.lib.
      # Pas de surcharge de INCLUDE : bindgen doit voir les en-tetes MSVC.
      - name: Build
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release

      - uses: ilammy/msvc-dev-cmd@v1

      - name: DLL requises par l'executable
        shell: pwsh
        run: dumpbin /dependents .\target\release\vdf-smoke.exe

      - name: DLL de MPIR a cote de l'executable
        shell: pwsh
        run: |
          $dir = (Resolve-Path "$env:USERPROFILE\.cargo\registry\src\*\chiavdf-1.1.14\mpir_gc_x64").Path
          Get-ChildItem $dir | Format-Table Name, Length
          Get-ChildItem $dir -Filter *.dll | Copy-Item -Destination .\target\release\
          .\target\release\vdf-smoke.exe 2>&1
          "exit=$LASTEXITCODE"

      - name: Officiel
        shell: pwsh
        continue-on-error: true
        env:
          RUST_BACKTRACE: full
        run: |
          .\target\release\vdf-smoke.exe official 2>&1
          $c = $LASTEXITCODE
          "exit=$c hex=" + ('{0:X}' -f $c)

      - name: Positif
        shell: pwsh
        continue-on-error: true
        run: |
          .\target\release\vdf-smoke.exe positive 2>&1
          $c = $LASTEXITCODE
          "exit=$c hex=" + ('{0:X}' -f $c)
        timeout-minutes: 3

      - name: Negatif
        shell: pwsh
        continue-on-error: true
        run: |
          .\target\release\vdf-smoke.exe negative 2>&1
          $c = $LASTEXITCODE
          "exit=$c hex=" + ('{0:X}' -f $c)
        timeout-minutes: 3

      - name: Bench T
        shell: pwsh
        continue-on-error: true
        run: |
          .\target\release\vdf-smoke.exe bench 2>&1
          $c = $LASTEXITCODE
          "exit=$c hex=" + ('{0:X}' -f $c)
        timeout-minutes: 10